{{- if not .Values.masterKey.existingSecret.name }}
{{- $secretName := printf "%s-masterkey" (include "litellm.fullname" .) }}
{{/*
Generated once, on first install. Later upgrades read the value back out of the
live Secret, so `helm upgrade` never rotates the master key and invalidates
every virtual key derived from it.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $masterKey := .Values.masterKey.value | default (dig "data" "masterkey" "" $existing | b64dec) | default (printf "sk-%s" (randAlphaNum 32)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  masterkey: {{ $masterKey | b64enc }}
{{- end }}
