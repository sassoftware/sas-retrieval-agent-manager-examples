{{- if and (include "litellm.dbInitEnabled" .) (include "litellm.dbInit.ownsAdminSecret" .) }}
{{/*
Administrator credentials for the initialization Job.

Rendered as a hook so that it exists before the Job that consumes it, and
deleted and recreated ahead of every install and upgrade. Recreating it is what
makes a re-run possible at all: the Job cannot create a role without an
administrator, and the previous run erased these keys on its way out.

The window in which these credentials are readable in the namespace is
therefore the hook window, not the life of the release.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.dbInit.adminSecretName" . }}
  labels:
    {{- include "litellm.dbInit.labels" . | nindent 4 }}
  annotations:
    {{- include "litellm.dbInit.hookAnnotations" (dict "root" . "weight" "-10") | nindent 4 }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  username: {{ .Values.database.init.admin.username | quote }}
  password: {{ .Values.database.init.admin.password | quote }}
{{- end }}
