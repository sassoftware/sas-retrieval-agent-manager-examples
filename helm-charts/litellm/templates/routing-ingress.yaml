{{- if .Values.routing.ingress.enabled }}
{{- $fullName := include "litellm.fullname" . }}
{{- $svcPort := .Values.service.port }}
{{- $r := .Values.routing }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
    {{- with $r.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $annotations := merge (dict) (default dict $r.ingress.annotations) (default dict $r.annotations) (default dict .Values.commonAnnotations) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $r.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $r.tls.enabled }}
  tls:
    - hosts:
        {{- range $r.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ $r.tls.secretName }}
  {{- end }}
  rules:
    {{- range $host := $r.hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ $r.path }}
            pathType: {{ include "litellm.ingressPathType" (dict "className" $r.ingress.className "pathType" $r.ingress.pathType "path" $r.path) }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- range $extra := $r.ingress.extraPaths }}
          - path: {{ $extra.path }}
            pathType: {{ include "litellm.ingressPathType" (dict "className" $r.ingress.className "pathType" (default $r.ingress.pathType $extra.pathType) "path" $extra.path) }}
            backend:
              service:
                name: {{ default $fullName (dig "service" "name" "" $extra) }}
                port:
                  number: {{ default $svcPort (dig "service" "port" 0 $extra) }}
          {{- end }}
    {{- end }}
{{- end }}
