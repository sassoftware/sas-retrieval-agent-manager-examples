{{- if and .Values.sso.enabled (include "litellm.sso.ownsSecret" .) }}
{{- $secretName := printf "%s-sso" (include "litellm.fullname" .) }}
{{/*
The OIDC client secret, and the bootstrap administrator's password.

Both are generated once and then read back out of the live Secret on every
later upgrade. That matters more here than for the master key: the client
secret is also registered on the Keycloak side, so regenerating it on each
upgrade would silently break sign-in until the bootstrap Job ran again.

This is rendered as an ordinary resource rather than a hook. The Job that
consumes it is a hook, so it is also given the hook annotations below at a
lower weight — Helm treats an object carrying hook annotations as a hook, and
a pre-install hook cannot reference a Secret that is only created afterwards.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $clientSecret := .Values.sso.clientSecret.value | default (dig "data" "client-secret" "" $existing | b64dec) | default (randAlphaNum 40) }}
{{/*
The generated administrator password ends in a fixed "Aa1!" because a Keycloak
realm commonly enforces a password policy, and the default
`upperCase(1) lowerCase(1) digits(1) specialChars(1)` is not satisfied by a
purely random alphanumeric string. Relying on chance is not good enough here:
28 random alphanumerics miss a digit about once in four hundred, which would
turn into an occasional, baffling deploy-time failure.

The suffix is public, so it contributes no secrecy; the 28 random characters
before it carry all of the entropy.
*/}}
{{- $adminPassword := .Values.sso.keycloakBootstrap.adminUser.password.value | default (dig "data" "admin-user-password" "" $existing | b64dec) | default (printf "%sAa1!" (randAlphaNum 28)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  annotations:
    {{- if include "litellm.keycloakBootstrapEnabled" . }}
    {{- include "litellm.hookAnnotations" (dict "hooks" .Values.sso.keycloakBootstrap.hooks "weight" "-10") | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  client-secret: {{ $clientSecret | b64enc }}
  {{- if and (include "litellm.keycloakBootstrapEnabled" .) .Values.sso.keycloakBootstrap.adminUser.enabled (not .Values.sso.keycloakBootstrap.adminUser.password.existingSecret.name) }}
  admin-user-password: {{ $adminPassword | b64enc }}
  {{- end }}
{{- end }}
