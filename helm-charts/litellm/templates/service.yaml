apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm.fullname" . }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) (default dict .Values.service.annotations) (default dict .Values.commonAnnotations) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
{{- if .Values.metricsServer.enabled }}
---
{{/*
The metrics port carries no virtual-key auth, so it gets a Service of its own
that routing never publishes. The ServiceMonitor scrapes this one.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm.fullname" . }}-metrics
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metricsServer.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
{{- end }}
