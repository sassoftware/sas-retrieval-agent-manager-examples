suite: parent component switches
templates:
  - templates/hf-secret.yaml
tests:
  - it: keeps the model service account enabled by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: hf-sa
  - it: can disable the parent service account
    set:
      serviceAccount.enabled: false
    asserts:
      - hasDocuments:
          count: 0
