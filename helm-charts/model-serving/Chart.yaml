apiVersion: v2
name: model-serving
description: >
  KServe umbrella chart. Installs the upstream KServe charts and adds OpenVINO
  and vLLM CPU ClusterServingRuntimes plus values-driven model deployments.
type: application
version: 0.1.1
appVersion: "v0.20.0"
dependencies:
  - name: kserve-crd
    version: v0.20.0
    repository: oci://ghcr.io/kserve/charts
    condition: components.kserveCrd.enabled
  - name: kserve-llmisvc-crd
    version: v0.20.0
    repository: oci://ghcr.io/kserve/charts
    condition: components.llmisvcCrd.enabled
  - name: kserve-localmodel-crd
    version: v0.20.0
    repository: oci://ghcr.io/kserve/charts
    condition: components.localModelCrd.enabled
  - name: kserve-resources
    version: v0.20.0
    repository: oci://ghcr.io/kserve/charts
    condition: components.kserve.enabled
  - name: kserve-llmisvc-resources
    version: v0.20.0
    repository: oci://ghcr.io/kserve/charts
    condition: components.llmisvc.enabled
  - name: kserve-localmodel-resources
    version: v0.20.0
    repository: oci://ghcr.io/kserve/charts
    condition: components.localModel.enabled
  - name: kserve-runtime-configs
    version: v0.20.0
    repository: oci://ghcr.io/kserve/charts
    condition: components.runtimeConfigs.enabled
