{{- $k := include "srouter.knobs" . | fromYaml }}
{{- $mgmt := $k.managementApi | default dict }}
{{- $auth := $mgmt.auth | default dict }}
{{- $token := $mgmt.token | default dict }}
{{- if and (eq ($auth.mode | default "bearer") "bearer") $token.create }}
{{- $secretName := include "srouter.managementToken.secretName" . }}
{{- $secretKey := include "srouter.managementToken.secretKey" . }}
{{/*
The admin token for the router's management API.

Generated once, on first install. Later upgrades read the value back out of
the live Secret, so `helm upgrade` never rotates the token and leaves the model
controller holding a credential the router no longer accepts.

The key is the environment variable name on purpose: the subchart mounts this
Secret with `envFromSecrets`, which projects every key as a variable of the
same name, and the router reads its token from
`global.services.management_api.auth.tokens[].env`.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $value := $token.value | default (dig "data" $secretKey "" $existing | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "srouter.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ $secretKey }}: {{ $value | b64enc }}
{{- end }}
