{{- /*
Every pool (leader, worker, prefill leader, prefill worker) is built the same way:

  container   image, args, resources, and volumeMounts resolve through the
              nearest source, then HF_TOKEN is injected unless disabled.
  pod fields  resolve through the same chain and are omitted when unset, so
              KServe keeps its own defaults.

Supplying `containers` explicitly under `template` or `worker` replaces the
generated container for that pool and is passed through verbatim.
*/ -}}
{{- range $entry := .Values.llmInferenceServices }}
{{- $defaults := $.Values.llmDefaults | default dict }}
{{- $secret := $.Values.hfSecret }}
{{- $image := $entry.image | default $defaults.image }}
{{- $args := $entry.args | default $defaults.args }}
{{- $resources := $entry.resources | default $defaults.resources }}
{{- $volumeMounts := $entry.volumeMounts | default $defaults.volumeMounts }}
{{- $inject := true }}
{{- if hasKey $entry "injectHfToken" }}{{- $inject = $entry.injectHfToken }}{{- end }}
{{- $inject = and $inject $secret.enabled }}
{{- $entryTemplate := $entry.template | default dict }}
{{- $worker := $entry.worker | default dict }}
{{- $prefill := $entry.prefill | default dict }}
{{- $prefillTemplate := $prefill.template | default dict }}
{{- $prefillWorker := $prefill.worker | default dict }}
{{- /* Prefill inherits the workload container settings, then overrides inside prefill. */}}
{{- $prefillImage := $prefill.image | default $image }}
{{- $prefillArgs := $prefill.args | default $args }}
{{- $prefillResources := $prefill.resources | default $resources }}
{{- $prefillMounts := $prefill.volumeMounts | default $volumeMounts }}
{{- $prefillInject := $inject }}
{{- if hasKey $prefill "injectHfToken" }}{{- $prefillInject = and $prefill.injectHfToken $secret.enabled }}{{- end }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ $entry.name }}
  namespace: {{ $entry.namespace | default $.Values.namespace }}
  labels:
    {{- include "model-serving.labels" $ | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  model:
    {{- toYaml $entry.model | nindent 4 }}
  {{- with ($entry.labels | default $defaults.labels) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with ($entry.annotations | default $defaults.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not $entry.scaling }}
  replicas: {{ $entry.replicas | default $defaults.replicas }}
  {{- end }}
  {{- with $entry.parallelism }}
  parallelism:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- with include "model-serving.llmPodSpec" (list $entryTemplate $entry $defaults) }}
    {{- . | nindent 4 }}
    {{- end }}
    containers:
      {{- if $entryTemplate.containers }}
      {{- toYaml $entryTemplate.containers | nindent 6 }}
      {{- else }}
      {{- include "model-serving.llmContainer" (dict "image" $image "args" $args "resources" $resources "volumeMounts" $volumeMounts "inject" $inject "secretName" $secret.name) | nindent 6 }}
      {{- end }}
  {{- if hasKey $entry "worker" }}
  worker:
    {{- with include "model-serving.llmPodSpec" (list $worker $entry $defaults) }}
    {{- . | nindent 4 }}
    {{- end }}
    containers:
      {{- if $worker.containers }}
      {{- toYaml $worker.containers | nindent 6 }}
      {{- else }}
      {{- include "model-serving.llmContainer" (dict "image" ($worker.image | default $image) "args" ($worker.args | default $args) "resources" ($worker.resources | default $resources) "volumeMounts" ($worker.volumeMounts | default $volumeMounts) "inject" $inject "secretName" $secret.name) | nindent 6 }}
      {{- end }}
  {{- end }}
  {{- if hasKey $entry "prefill" }}
  prefill:
    {{- if hasKey $prefill "replicas" }}
    replicas: {{ $prefill.replicas }}
    {{- end }}
    {{- with $prefill.parallelism }}
    parallelism:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $prefill.scaling }}
    scaling:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $prefill.labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $prefill.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    template:
      {{- with include "model-serving.llmPodSpec" (list $prefillTemplate $prefill $entry $defaults) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        {{- if $prefillTemplate.containers }}
        {{- toYaml $prefillTemplate.containers | nindent 8 }}
        {{- else }}
        {{- include "model-serving.llmContainer" (dict "image" $prefillImage "args" $prefillArgs "resources" $prefillResources "volumeMounts" $prefillMounts "inject" $prefillInject "secretName" $secret.name) | nindent 8 }}
        {{- end }}
    {{- if hasKey $prefill "worker" }}
    worker:
      {{- with include "model-serving.llmPodSpec" (list $prefillWorker $prefill $entry $defaults) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        {{- if $prefillWorker.containers }}
        {{- toYaml $prefillWorker.containers | nindent 8 }}
        {{- else }}
        {{- include "model-serving.llmContainer" (dict "image" ($prefillWorker.image | default $prefillImage) "args" ($prefillWorker.args | default $prefillArgs) "resources" ($prefillWorker.resources | default $prefillResources) "volumeMounts" ($prefillWorker.volumeMounts | default $prefillMounts) "inject" $prefillInject "secretName" $secret.name) | nindent 8 }}
        {{- end }}
    {{- end }}
  {{- end }}
  router:
    {{- toYaml ($entry.router | default $defaults.router) | nindent 4 }}
  {{- with $entry.scaling }}
  scaling:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $entry.baseRefs }}
  baseRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
