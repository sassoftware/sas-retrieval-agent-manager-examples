{{- if and .Values.hfSecret.enabled .Values.hfSecret.managed }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hfSecret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "model-serving.labels" . | nindent 4 }}
stringData:
  HF_TOKEN: {{ .Values.hfSecret.token | quote }}
type: Opaque
{{- end }}

{{- if .Values.serviceAccount.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "model-serving.labels" . | nindent 4 }}
{{- if .Values.hfSecret.enabled }}
secrets:
  - name: {{ .Values.hfSecret.name }}
{{- end }}
{{- end }}
