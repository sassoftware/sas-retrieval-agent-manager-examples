suite: llm prefill pools
templates:
  - templates/llminferenceservices.yaml
set:
  namespace: fixture-models
  hfSecret:
    enabled: true
    managed: false
    name: fixture-hf
  llmDefaults:
    replicas: 1
    image: vllm/vllm-openai:v0.11.0
    args: [--model, /mnt/models]
    resources:
      limits:
        cpu: "8"
        memory: 32Gi
    router:
      gateway: {}
      route: {}
      scheduler: {}
tests:
  - it: omits prefill unless the key is present
    set:
      llmInferenceServices:
        - name: no-prefill
          model:
            uri: hf://org/llm
    asserts:
      - notExists:
          path: spec.prefill

  - it: builds a prefill pool from the workload when prefill is empty
    set:
      llmInferenceServices:
        - name: empty-prefill
          model:
            uri: hf://org/llm
          prefill: {}
    asserts:
      - exists:
          path: spec.prefill.template.containers
      - equal:
          path: spec.prefill.template.containers[0].image
          value: vllm/vllm-openai:v0.11.0
      - equal:
          path: spec.prefill.template.containers[0].args[0]
          value: --model
      - equal:
          path: spec.prefill.template.containers[0].resources.limits.cpu
          value: "8"

  - it: injects the token into a generated prefill container
    set:
      llmInferenceServices:
        - name: token-prefill
          model:
            uri: hf://org/llm
          prefill:
            replicas: 2
    asserts:
      - equal:
          path: spec.prefill.template.containers[0].env[0].name
          value: HF_TOKEN
      - equal:
          path: spec.prefill.template.containers[0].env[0].valueFrom.secretKeyRef.name
          value: fixture-hf
      - equal:
          path: spec.prefill.replicas
          value: 2

  - it: lets prefill override the container settings
    set:
      llmInferenceServices:
        - name: custom-prefill
          model:
            uri: hf://org/llm
          prefill:
            image: vllm/vllm-openai:v0.12.0
            args:
              - --model
              - /mnt/models
              - --enable-chunked-prefill
            resources:
              limits:
                cpu: "16"
                memory: 64Gi
                nvidia.com/gpu: "2"
    asserts:
      - equal:
          path: spec.prefill.template.containers[0].image
          value: vllm/vllm-openai:v0.12.0
      - equal:
          path: spec.prefill.template.containers[0].args[2]
          value: --enable-chunked-prefill
      - equal:
          path: spec.prefill.template.containers[0].resources.limits["nvidia.com/gpu"]
          value: "2"
      - equal:
          path: spec.template.containers[0].image
          value: vllm/vllm-openai:v0.11.0

  - it: inherits workload placement into prefill
    set:
      llmInferenceServices:
        - name: inherited-prefill
          model:
            uri: hf://org/llm
          nodeSelector:
            accelerator: nvidia-a100
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          prefill: {}
    asserts:
      - equal:
          path: spec.prefill.template.nodeSelector.accelerator
          value: nvidia-a100
      - equal:
          path: spec.prefill.template.tolerations[0].key
          value: nvidia.com/gpu

  - it: lets prefill override placement
    set:
      llmInferenceServices:
        - name: pinned-prefill
          model:
            uri: hf://org/llm
          nodeSelector:
            accelerator: nvidia-a100
          prefill:
            nodeSelector:
              accelerator: nvidia-h100
            priorityClassName: prefill-priority
    asserts:
      - equal:
          path: spec.template.nodeSelector.accelerator
          value: nvidia-a100
      - equal:
          path: spec.prefill.template.nodeSelector.accelerator
          value: nvidia-h100
      - equal:
          path: spec.prefill.template.priorityClassName
          value: prefill-priority

  - it: passes explicit prefill containers through verbatim
    set:
      llmInferenceServices:
        - name: verbatim-prefill
          model:
            uri: hf://org/llm
          prefill:
            replicas: 2
            template:
              nodeSelector:
                accelerator: nvidia-h100
              containers:
                - name: main
                  image: custom/image:1.0.0
                  args: [--custom]
    asserts:
      - equal:
          path: spec.prefill.template.containers[0].image
          value: custom/image:1.0.0
      - equal:
          path: spec.prefill.template.containers[0].args[0]
          value: --custom
      - notExists:
          path: spec.prefill.template.containers[0].env
      - equal:
          path: spec.prefill.template.nodeSelector.accelerator
          value: nvidia-h100

  - it: supports a prefill worker for multi-node prefill
    set:
      llmInferenceServices:
        - name: multinode-prefill
          model:
            uri: hf://org/llm
          prefill:
            nodeSelector:
              accelerator: nvidia-h100
            parallelism:
              tensor: 4
              data: 8
              dataLocal: 4
            worker:
              priorityClassName: prefill-worker
    asserts:
      - equal:
          path: spec.prefill.parallelism.tensor
          value: 4
      - equal:
          path: spec.prefill.worker.containers[0].image
          value: vllm/vllm-openai:v0.11.0
      - equal:
          path: spec.prefill.worker.nodeSelector.accelerator
          value: nvidia-h100
      - equal:
          path: spec.prefill.worker.priorityClassName
          value: prefill-worker
      - equal:
          path: spec.prefill.worker.containers[0].env[0].name
          value: HF_TOKEN

  - it: honours prefill scaling, labels, and annotations
    set:
      llmInferenceServices:
        - name: scaled-prefill
          model:
            uri: hf://org/llm
          prefill:
            scaling:
              minReplicas: 1
              maxReplicas: 6
            labels:
              pool: prefill
            annotations:
              owner: platform-team
    asserts:
      - equal:
          path: spec.prefill.scaling.maxReplicas
          value: 6
      - equal:
          path: spec.prefill.labels.pool
          value: prefill
      - equal:
          path: spec.prefill.annotations.owner
          value: platform-team

  - it: can disable token injection for prefill only
    set:
      llmInferenceServices:
        - name: no-token-prefill
          model:
            uri: hf://org/llm
          prefill:
            injectHfToken: false
    asserts:
      - equal:
          path: spec.template.containers[0].env[0].name
          value: HF_TOKEN
      - notExists:
          path: spec.prefill.template.containers[0].env
