suite: llm scheduling and pod fields
templates:
  - templates/llminferenceservices.yaml
tests:
  - it: omits pod fields when nothing is configured
    set:
      namespace: fixture-models
      llmInferenceServices:
        - name: plain-llm
          model:
            uri: hf://org/llm
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.template.nodeSelector
      - notExists:
          path: spec.template.tolerations
      - notExists:
          path: spec.template.affinity
      - notExists:
          path: spec.labels
      - exists:
          path: spec.template.containers[0].image

  - it: renders leader pod scheduling fields
    set:
      namespace: fixture-models
      llmInferenceServices:
        - name: gpu-llm
          model:
            uri: hf://org/llm
          nodeSelector:
            accelerator: nvidia-a100
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
          priorityClassName: high-priority
          runtimeClassName: nvidia
    asserts:
      - equal:
          path: spec.template.nodeSelector.accelerator
          value: nvidia-a100
      - equal:
          path: spec.template.tolerations[0].key
          value: nvidia.com/gpu
      - equal:
          path: spec.template.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.priorityClassName
          value: high-priority
      - equal:
          path: spec.template.runtimeClassName
          value: nvidia

  - it: gives the worker the same placement as the leader by default
    set:
      namespace: fixture-models
      llmInferenceServices:
        - name: multinode-llm
          model:
            uri: hf://org/llm
          nodeSelector:
            accelerator: nvidia-a100
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          worker: {}
    asserts:
      - equal:
          path: spec.worker.nodeSelector.accelerator
          value: nvidia-a100
      - equal:
          path: spec.worker.tolerations[0].key
          value: nvidia.com/gpu

  - it: lets the worker override leader placement
    set:
      namespace: fixture-models
      llmInferenceServices:
        - name: mixed-llm
          model:
            uri: hf://org/llm
          nodeSelector:
            accelerator: nvidia-h100
          worker:
            nodeSelector:
              accelerator: nvidia-a100
            priorityClassName: worker-priority
    asserts:
      - equal:
          path: spec.template.nodeSelector.accelerator
          value: nvidia-h100
      - equal:
          path: spec.worker.nodeSelector.accelerator
          value: nvidia-a100
      - equal:
          path: spec.worker.priorityClassName
          value: worker-priority

  - it: applies llmDefaults pod fields to every entry
    set:
      namespace: fixture-models
      llmDefaults:
        replicas: 1
        image: vllm/vllm-openai:v0.11.0
        args: [--model, /mnt/models]
        nodeSelector:
          pool: gpu
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
      llmInferenceServices:
        - name: first-llm
          model:
            uri: hf://org/first
        - name: second-llm
          model:
            uri: hf://org/second
          worker: {}
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.template.nodeSelector.pool
          value: gpu
        documentIndex: 0
      - equal:
          path: spec.worker.tolerations[0].key
          value: nvidia.com/gpu
        documentIndex: 1

  - it: lets an entry override llmDefaults pod fields
    set:
      namespace: fixture-models
      llmDefaults:
        replicas: 1
        image: vllm/vllm-openai:v0.11.0
        nodeSelector:
          pool: gpu
      llmInferenceServices:
        - name: override-llm
          model:
            uri: hf://org/llm
          nodeSelector:
            pool: reserved
    asserts:
      - equal:
          path: spec.template.nodeSelector.pool
          value: reserved

  - it: honours false booleans instead of falling back
    set:
      namespace: fixture-models
      llmDefaults:
        replicas: 1
        image: vllm/vllm-openai:v0.11.0
        hostIPC: true
      llmInferenceServices:
        - name: no-hostipc
          model:
            uri: hf://org/llm
          hostIPC: false
          terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.hostIPC
          value: false
      - equal:
          path: spec.template.terminationGracePeriodSeconds
          value: 0

  - it: renders workload labels, annotations, volumes, and mounts
    set:
      namespace: fixture-models
      llmInferenceServices:
        - name: full-llm
          model:
            uri: hf://org/llm
          labels:
            tier: production
          annotations:
            owner: platform-team
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 8Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
          serviceAccountName: llm-sa
    asserts:
      - equal:
          path: spec.labels.tier
          value: production
      - equal:
          path: spec.annotations.owner
          value: platform-team
      - equal:
          path: spec.template.volumes[0].name
          value: cache
      - equal:
          path: spec.template.containers[0].volumeMounts[0].mountPath
          value: /cache
      - equal:
          path: spec.template.serviceAccountName
          value: llm-sa

  - it: lets an explicit prefill template keep its own placement
    set:
      namespace: fixture-models
      llmInferenceServices:
        - name: disagg-llm
          model:
            uri: hf://org/llm
          nodeSelector:
            accelerator: nvidia-a100
          prefill:
            replicas: 2
            template:
              nodeSelector:
                accelerator: nvidia-h100
              containers:
                - name: main
                  image: vllm/vllm-openai:v0.11.0
    asserts:
      - equal:
          path: spec.prefill.template.nodeSelector.accelerator
          value: nvidia-h100
      - equal:
          path: spec.prefill.replicas
          value: 2
